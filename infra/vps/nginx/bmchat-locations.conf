# Drop-in for /etc/nginx/sites-enabled/nod-tracker, port-80 server block.
# Copy the location blocks below INSIDE the existing
#   server { listen 80; server_name mynod.duckdns.org 5.187.4.132; ... }
# (placed BEFORE the existing `return 301 https://$host$request_uri;`)

# Static landing pages.
location = / {
    try_files /bmchat/index.html =404;
    root /var/www;
}
location = /bmchat {
    return 301 /;
}
location ^~ /bmchat/ {
    alias /var/www/bmchat/;
    autoindex off;
    try_files $uri $uri/ =404;
}

# Invite landing page (served from i.html for any /i or /i/...).
location = /i {
    alias /var/www/bmchat/i.html;
    default_type text/html;
}
location ^~ /i/ {
    alias /var/www/bmchat/i.html;
    default_type text/html;
}

# Auto-update manifests. Always fresh, JSON content type.
location = /update.json {
    alias /var/www/bmchat/update.json;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
}
location = /desktop-update.json {
    alias /var/www/bmchat/desktop-update.json;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# Desktop installer storage (Electron builder outputs).
location ^~ /desktop/ {
    alias /var/www/bmchat/desktop/;
    autoindex off;
    types {
        application/x-msdownload exe;
        application/x-apple-diskimage dmg;
        application/x-executable AppImage;
        application/x-debian-package deb;
        application/octet-stream zip;
    }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    sendfile on;
    tcp_nopush on;
}

# APK distribution. Big files, range support, no caching of stale builds.
location ^~ /apk/ {
    alias /var/www/bmchat/apk/;
    autoindex off;
    types { application/vnd.android.package-archive apk; }
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    sendfile on;
    tcp_nopush on;
}

# Telegram media proxy. The Android client encrypts (bot_token,
# file_id, exp) with AES-GCM under a shared secret and embeds the
# blob as /tgmedia/<urlsafe-b64>; the Python service on 127.0.0.1:8090
# decrypts it, performs Telegram getFile + download, and streams the
# bytes back. Bot tokens never appear in plaintext URLs, expired
# blobs are rejected. Backend is gunicorn-managed by the
# bmchat-tgproxy.service systemd unit.
location ^~ /tgmedia/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Telegram CDN is slow on cold-cache videos — bump the upstream
    # timeouts so a 4-minute 4K clip doesn't get cut off.
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    add_header Cache-Control "public, max-age=600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Local Telegram Bot API server (tdlib-backed, --local mode). Lifts
# the 20 MB getFile cap that cloud Bot API enforces; required for
# forwarding multi-MB videos / documents to BMChat bots. Bound to
# 127.0.0.1:8083 so only this nginx instance can reach it. Path
# is rewritten so the upstream sees the unmodified /bot<TOKEN>/method
# layout it expects. Body size is wide open for getFile responses
# that include 4 GB videos, and timeouts are generous because tdlib
# may take a moment on cold-cache lookups.
location ^~ /bot-api/ {
    rewrite ^/bot-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_buffering off;
    client_max_body_size 2048m;
    add_header X-Content-Type-Options "nosniff" always;
}
